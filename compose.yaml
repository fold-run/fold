# Local / single-host deployment. Expects ./fold.config.json (start from
# fold.config.example.json). Access via http://localhost:8080 — "localhost"
# passes the gateway's default host allowlist, so no allowedHosts config is
# needed for local use.
#
# The fold healthcheck runs the binary's own self-probe (`fold
# --healthcheck`) — the distroless image carries no shell or curl, so the
# probe ships inside the binary. It answers "is the process serving", never
# "are upstreams up" (that would restart fold at the worst moment).
#
# Optional shared-state Redis (only useful when running several gateway
# instances): docker compose --profile redis up
#
# Optional stdio shim, to federate an MCP server that has no HTTP endpoint:
# docker compose --profile stdio up   (see the stdio service below)
#
# Optional observability stack — Prometheus scraping fold, and Grafana with
# fold's dashboard already loaded (no import step):
# docker compose --profile observability up
# Then http://localhost:3000 (anonymous, admin) → "fold — gateway overview".
#
# One config line is required for it: fold's DNS-rebinding protection covers
# /metrics like every other path, and Prometheus scrapes with Host "fold" (the
# service name), which the default localhost allowlist does not admit — the
# scrape gets 403 and the target sits down. Add the service name:
#   "server": { "allowedHosts": ["localhost", "fold"] }

name: fold-run

services:
  fold:
    image: ghcr.io/fold-run/fold:v1.15.0 # equals the chart appVersion, enforced by gateway/release_pins_test.go and bumped by the release flow; verify with `gh attestation verify`
    # To run from source instead:
    # build:
    #   context: .
    #   dockerfile: deploy/docker/fold.Dockerfile
    command:
      - --config
      - /etc/fold/fold.config.json
      - --host
      - 0.0.0.0
      - --log-format
      - json
    ports:
      # Loopback like Redis below: this file is a local/dev arrangement, and
      # the gateway (possibly auth-disabled) must not be LAN-reachable by
      # default. Publishing deliberately: override with "0.0.0.0:8080:8080".
      - "127.0.0.1:8080:8080"
    volumes:
      - ./fold.config.json:/etc/fold/fold.config.json:ro
    # Secrets referenced by the config's secretRef fields are plain env vars;
    # pass them through from the host (or an env_file). SHIM_TOKEN is here
    # rather than commented out because the gateway resolves the shim's
    # bearer from its own environment — with it absent the stdio upstream
    # fails to authenticate. `:-` keeps it harmless when the profile is off.
    environment:
      - SHIM_TOKEN=${SHIM_TOKEN:-}
    #  - ML_SEARCH_API_KEY=${ML_SEARCH_API_KEY}
    #  - REDIS_URL=redis://redis:6379   # with: docker compose --profile redis up
    healthcheck:
      test: ["CMD", "/fold", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    profiles: ["redis"]
    image: redis:7-alpine # valkey/valkey:8-alpine is a drop-in alternative
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  # The stdio shim: runs one local MCP server and serves it over streamable
  # HTTP, so the gateway can federate a server that has no network endpoint.
  # One shim per server — see docs/stdio.md.
  #
  # Add the matching upstream to fold.config.json. The shim requires a bearer
  # (its entrypoint binds 0.0.0.0, and a non-loopback bind without a token is
  # refused at startup), so the gateway brokers one with the `static` strategy
  # — the agent never holds it:
  #
  #   {
  #     "id": "files",
  #     "url": "http://stdio:8091/mcp",
  #     "namespace": "files",
  #     "auth": { "strategy": "static", "secretRef": "SHIM_TOKEN" },
  #     "timeouts": { "connectMs": 30000 }
  #   }
  #
  # connectMs is raised because npx resolves and starts the server on every
  # spawn, and each session spawns one. Set SHIM_TOKEN in the environment of
  # both services (the same value), or use an env_file.
  stdio:
    profiles: ["stdio"]
    # Carries Node, since npx-delivered servers are the common case. To serve a
    # Python server, or to pin your own runtime base, build from source instead
    # by uncommenting `build` (see deploy/docker/stdio.Dockerfile).
    image: ghcr.io/fold-run/fold-stdio:v1.15.0 # equals the chart appVersion (release_pins_test.go)
    # build:
    #   context: .
    #   dockerfile: deploy/docker/stdio.Dockerfile
    command:
      - --bearer-env
      - SHIM_TOKEN
      - --env-passthrough
      - HOME,PATH
      - --log-format
      - json
      # Everything after `--` is the server. Fixed here at startup: the shim
      # never takes a command from the network.
      - --
      - npx
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - /data
    # Set SHIM_TOKEN to a random string. Deliberately not a compose-level
    # required variable: that is evaluated for the whole file regardless of
    # profile, so it would break `docker compose up` for anyone not running the
    # shim. The binary refuses to start on an empty token anyway, which keeps
    # the enforcement in one place.
    environment:
      - SHIM_TOKEN=${SHIM_TOKEN}
    # What the filesystem server is allowed to see. Create ./data before the
    # first run, or compose will make it for you and the server will find it
    # empty.
    volumes:
      - ./data:/data:ro
    # Not published to the host: only the gateway needs to reach it, and the
    # shim runs processes on demand. Expose it only if you mean to.
    expose:
      - "8091"
    restart: unless-stopped

  # --- observability profile -------------------------------------------
  # The same dashboard and rules the Helm chart ships, wired for a single
  # host. Both files are mounted from the paths the chart also uses, so a
  # compose deployment and a Kubernetes one cannot drift into showing
  # different things.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # Enough for a laptop; this stack is for seeing the gateway, not for
      # long-term retention.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    restart: unless-stopped

  # Receives fold's spans and OTLP audit events and prints them; the runnable
  # example for the `tracing` section and the `otlp-logs` sink. Reachable from
  # the gateway as otel-collector:4318 (the example config's endpoint); not
  # published to the host.
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    expose:
      - "4318"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.1
    ports:
      # Loopback is load-bearing here: Grafana runs anonymous-Admin below.
      - "127.0.0.1:3000:3000"
    environment:
      # Anonymous admin: this is a local stack bound to localhost, and a login
      # prompt in front of a demo dashboard is friction without a threat model.
      # Do not copy this into anything reachable.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard lives in the chart, and is mounted from there rather than
      # copied: one file, two deployment shapes.
      - ./deploy/helm/fold/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
