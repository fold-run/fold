# Default values for the fold chart.
#
# The gateway config itself is required: set exactly one of `config`
# (inline, rendered into a ConfigMap) or `existingConfigMap` (the name of a
# ConfigMap you manage, holding the document under the key fold.config.json).

image:
  repository: ghcr.io/fold-run/fold
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Ignored when autoscaling.enabled is true.
replicaCount: 2

# Rollout shape. maxUnavailable: 0 means a serving pod is never taken away
# before its replacement is Ready — with the default two replicas and the
# PDB's minAvailable: 1, the Kubernetes defaults (25%/25%) would otherwise
# let a rollout run on one pod. maxSurge: 1 is the price: one extra pod for
# the duration.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
# ReplicaSets kept for `helm rollback` / `kubectl rollout undo`.
revisionHistoryLimit: 5

# A gateway that fronts every MCP call in the cluster should be evicted last.
# Name a PriorityClass you have created; empty leaves the default.
priorityClassName: ""

lifecycle:
  # Seconds the container sleeps after SIGTERM is decided but before it is
  # sent, so endpoint removal propagates to kube-proxy and the ingress before
  # the listener closes. Without it a rollout produces a few seconds of
  # refused connections per pod. Uses the Kubernetes 1.30+ `sleep` action —
  # the image is distroless and has no shell to sleep with — and is omitted
  # on older clusters. 0 disables.
  preStopSleepSeconds: 5

# The fold config document (see fold.config.example.json in the repo root),
# rendered verbatim into a ConfigMap as fold.config.json. In production set
# config.server.allowedHosts to your public hostname(s) — the gateway's
# DNS-rebinding protection rejects unknown Host headers, and the chart derives
# the probe Host header from the first entry (see probes.hostHeader).
config: {}
#  upstreams:
#    - id: github-tools
#      url: https://mcp.platform.acme.com/mcp
#      namespace: gh
#  server:
#    allowedHosts: ["gw.example.com"]

# Alternative to `config`: name of an existing ConfigMap whose key
# fold.config.json holds the document. Requires probes.hostHeader, since the
# chart cannot see your allowedHosts. Config changes do not restart pods by
# themselves — use Reloader or `kubectl rollout restart`.
existingConfigMap: ""

# fold's config never contains secret material — auth strategies name
# environment variables via secretRef fields. Inject those variables from
# Kubernetes Secrets here.
envFrom: []
#  - secretRef:
#      name: fold-upstream-secrets

# Extra environment entries (name/value or valueFrom), merged after envFrom.
env: []

redis:
  # Optional: shares rate-limit, circuit-breaker, cache, and replay state
  # across replicas so the fleet behaves as one gateway. Without it each pod
  # keeps in-memory state (fine for replicaCount: 1). External Redis/Valkey
  # only — the chart deliberately ships no Redis subchart.
  # Plain redis:// URL — for password-less endpoints only: this value lands
  # verbatim in the Deployment manifest, readable by anyone who can `get
  # deployments`. A URL carrying a password belongs in existingSecret.
  url: ""
  # Name of a Secret holding the URL, and the key within it.
  existingSecret: ""
  existingSecretKey: "redis-url"

server:
  port: 8080
  logFormat: json
  logLevel: info
  # How long SIGTERM waits for in-flight requests and open streams before
  # severing them (fold's --drain-timeout, a Go duration such as 15s). Empty
  # passes no flag and fold uses its default, 10 s. Requires fold >= v1.16.0
  # when set — older images do not know the flag. terminationGracePeriodSeconds
  # must exceed preStopSleepSeconds + the drain (10 s when empty), or the
  # kubelet kills the pod mid-drain; the chart refuses to render otherwise.
  drainTimeout: ""
  # Additional CLI arguments appended to the container args.
  extraArgs: []

probes:
  # Host header sent with httpGet probes. Must be a hostname the gateway's
  # allowedHosts admits, or probes are answered 403 and the pod never becomes
  # ready. Empty = derived: first non-"*" entry of config.server.allowedHosts,
  # falling back to "localhost" (which the gateway's default allowlist
  # admits). Required when existingConfigMap is set.
  hostHeader: ""
  # /health pings every upstream (5s internal budget), so it doubles as a
  # real upstream health check: timeouts stay above 5s and periods
  # conservative. The fan-out is single-flighted and cached for a second, so
  # probe frequency no longer sets upstream ping frequency. Liveness stays a
  # TCP probe on purpose — it should only detect a wedged process.
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 8
    failureThreshold: 24
  readiness:
    enabled: true
    # http probes GET `path` (default /health, which is 503 when every
    # probeable upstream is down — so a total upstream outage removes every
    # pod from the Service and clients see an ingress 502/503 instead of
    # fold's own -31041 + partialFailure answer). Set mode: tcp to keep pods
    # in rotation on process liveness alone and let fold's error semantics
    # reach clients; the trade-off is written up in docs/deploy.md.
    mode: http
    path: /health
    periodSeconds: 15
    timeoutSeconds: 8
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 20
    failureThreshold: 3

# Runs `fold --validate` against the mounted config before the gateway
# starts, so a bad config fails the rollout instead of crash-looping.
# Validation never resolves secretRef env vars, so no secrets are needed.
validateInitContainer:
  enabled: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Opt-in NetworkPolicy. Two things make it worth turning on here more than
# in the average chart: the metrics listener's documented security model is
# "you did not put it on the public network" — this is the chart-native way
# to make that true — and the pod holds every upstream credential, which an
# egress allowlist meaningfully contains. Requires a CNI that enforces
# NetworkPolicy; on one that doesn't, the object renders and does nothing.
networkPolicy:
  enabled: false
  # Peers allowed to reach the MCP port. Empty = any peer the CNI admits
  # (the policy still scopes the metrics port separately).
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []
  # Peers allowed to scrape the metrics listener port (rendered only when
  # metrics.listener.enabled). Empty = any.
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  metricsIngressFrom: []
  # Egress lockdown: when enabled, the pod may reach DNS plus only these
  # rules — cover your upstreams, IdP (JWKS/token endpoints), Redis, and
  # any audit webhook/OTLP collector.
  egress:
    enabled: false
    rules: []
    #  - to:
    #      - namespaceSelector: {}
    #    ports:
    #      - port: 443
    #        protocol: TCP

ingress:
  enabled: false
  className: ""
  # MCP responses ride long-lived SSE streams: raise idle/read timeouts and
  # disable response buffering at the ingress. For ingress-nginx:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  annotations: {}
  hosts: []
  #  - host: gw.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: fold-tls
  #    hosts: [gw.example.com]

serviceAccount:
  create: true
  name: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  # HPA scaling behaviour (autoscaling/v2 `behavior`). Scale-down cuts live
  # SSE sessions on the pods it removes, so the default here is slower than
  # Kubernetes' own: wait five minutes of sustained low load and remove at
  # most one pod a minute.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

# On by default: the chart defaults to two replicas, which is exactly the
# shape where one node drain can take both pods at once. Rendered only when
# it protects something — with a single fixed replica a minAvailable: 1
# budget would block every voluntary drain, so the template skips it there.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

metrics:
  # A separate listener for /metrics (and /health), which is what makes
  # scraping work without weakening the public endpoint. fold's DNS-rebinding
  # protection covers /metrics on the main port, and the operator scrapes pod
  # IPs — a Host no static allowlist can name — so with this off the
  # ServiceMonitor below is answered 403 unless server.allowedHosts includes
  # "*". Enabled here, the chart sets server.metricsAddr for you (inline
  # `config` only) and points the ServiceMonitor at this port.
  listener:
    enabled: false
    port: 9090
    # With existingConfigMap the chart cannot inject server.metricsAddr into
    # your document, so enabling the listener would open a port nothing
    # binds: Service, NetworkPolicy, and ServiceMonitor all pointing at a
    # dead target. The chart refuses to render that unless you confirm your
    # ConfigMap sets server.metricsAddr to ":<port>" yourself.
    externalConfigSetsMetricsAddr: false

  serviceMonitor:
    # Requires the prometheus-operator CRDs.
    enabled: false
    interval: 30s
    # Extra labels for Prometheus discovery, e.g. release: prometheus
    labels: {}

  # Packaged alert rules (deploy/helm/fold/templates/prometheusrule.yaml).
  # fold's metric names are frozen by its v1 compatibility contract, which is
  # what makes shipping rules against them safe across upgrades.
  prometheusRule:
    # Requires the prometheus-operator CRDs.
    enabled: false
    # Extra labels for Prometheus rule discovery, e.g. release: prometheus
    labels: {}
    # Labels added to every alert (not to the rule object), e.g. team: platform
    additionalLabels: {}
    # Fraction of requests fold itself failed (error + upstream_down) that
    # trips FoldErrorRateHigh. Refusals are excluded from the numerator.
    errorRatioThreshold: 0.01
    # p99 end-to-end seconds tripping FoldRequestLatencyHigh. This is a
    # deployment choice, not a fold constant: the measurement includes the
    # upstream's own time, so set it from your slowest legitimate tool.
    latencyP99Seconds: 2
    # Per-second edge rejections (bad Host/Origin, unauthenticated) tripping
    # FoldIngressRejectionSpike.
    rejectionRateThreshold: 1
    # p99 seconds for one decision-hook round trip, tripping
    # FoldHookLatencyHigh. This is latency fold adds on purpose at your
    # request, so set it from the hook's own timeoutMs rather than from any
    # fold constant.
    hookLatencyP99Seconds: 0.5
    # Sustained goroutine count tripping FoldGoroutinesHigh, and resident
    # memory in bytes tripping FoldMemoryHigh (default 200 MiB, under the
    # chart's 256Mi limit). Both are leak detectors for the growth a short
    # benchmark cannot see; size them from your own steady state.
    goroutinesThreshold: 10000
    memoryBytesThreshold: 209715200

  # The Grafana dashboard, delivered as a ConfigMap for the Grafana sidecar.
  # The JSON itself is deploy/helm/fold/dashboards/fold-overview.json — import
  # it directly if you do not run the sidecar.
  dashboard:
    enabled: false
    # The label the sidecar watches. kube-prometheus-stack uses
    # grafana_dashboard: "1".
    label: grafana_dashboard
    labelValue: "1"
    # Optional extra labels on the ConfigMap.
    labels: {}
    # Sets the grafana_folder annotation when non-empty.
    folderAnnotation: ""

# No CPU limit on purpose: a latency-sensitive proxy under a CPU limit is
# throttled exactly when it is busiest, and the request is what the scheduler
# needs. The memory limit is a backstop, not a measurement — see
# docs/operations.md "Sizing" for what to set it from.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

# Extra volumes and mounts on the gateway container. The two reasons to need
# them: a private CA bundle (mount it and point SSL_CERT_FILE at it via
# `env`; Go reads that variable, and the distroless image has no
# update-ca-certificates), and a writable path for the `file` audit sink or
# a `deadLetterPath` under readOnlyRootFilesystem (an emptyDir, or a PVC if
# it must survive the pod).
extraVolumes: []
#  - name: private-ca
#    configMap:
#      name: corp-ca-bundle
extraVolumeMounts: []
#  - name: private-ca
#    mountPath: /etc/ssl/private
#    readOnly: true

# The image is distroless nonroot and the binary never writes to disk, so
# the strictest settings work as-is.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Must exceed lifecycle.preStopSleepSeconds + server.drainTimeout (the
# chart refuses to render otherwise): SIGTERM → fold drains for drainTimeout,
# severing SSE streams still open at that bound and exiting 0.
terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# `helm test <release>` runs deploy/helm/fold/files/smoke.sh against the
# Service: initialize → tools/list → /health → /metrics, with the probe Host
# header. Any curl-carrying image works; the default is pinned by digest.
tests:
  enabled: true
  image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
  # A tool to call with empty arguments after tools/list (its namespaced
  # name, e.g. gh__list_repos). Empty skips the call.
  tool: ""
  # Extra env for the test pod — e.g. a bearer token for an auth-required
  # gateway, then reference it in `tool`-less runs via SMOKE_TOKEN below.
  env: []
