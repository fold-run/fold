apiVersion: v2
name: fold
description: >-
  fold, the enterprise MCP gateway — one governed endpoint federating any
  number of upstream MCP servers, adding auth, policy, caching, rate
  limiting, and audit.
type: application
# `appVersion` is the released gateway version this chart deploys by default:
# values.yaml ships `image.tag: ""`, so the deployment falls back to it. The
# release flow bumps it (see .claude/skills/fold-release) — a stale value here
# is what users actually install, not a label.
# `version` is the chart's own version and the OCI tag it publishes under
# (oci://ghcr.io/fold-run/charts/fold) — bump it on every change under
# deploy/helm/, since a published tag is immutable and a reused one is a
# different chart wearing the same name. It moves independently of appVersion:
# a chart fix that ships no new gateway is still a chart release.
version: 0.4.2
appVersion: "v1.15.0"
home: https://github.com/fold-run/fold
sources:
  - https://github.com/fold-run/fold
keywords:
  - mcp
  - gateway
  - model-context-protocol
