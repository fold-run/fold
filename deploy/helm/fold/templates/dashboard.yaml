{{- if .Values.metrics.dashboard.enabled }}
# The dashboard ships as a ConfigMap carrying the label Grafana's sidecar
# watches for (grafana_dashboard by convention), so an operator running the
# kube-prometheus-stack gets it without importing JSON by hand. Anyone else
# imports deploy/helm/fold/dashboards/fold-overview.json directly — the file is
# the artifact, this template is only delivery.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fold.fullname" . }}-dashboard
  labels:
    {{- include "fold.labels" . | nindent 4 }}
    {{ .Values.metrics.dashboard.label }}: {{ .Values.metrics.dashboard.labelValue | quote }}
    {{- with .Values.metrics.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.dashboard.folderAnnotation }}
  annotations:
    grafana_folder: {{ . | quote }}
  {{- end }}
data:
  fold-overview.json: |-
    {{- .Files.Get "dashboards/fold-overview.json" | nindent 4 }}
{{- end }}
