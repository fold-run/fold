{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- fail "metrics.serviceMonitor.enabled requires the prometheus-operator CRDs (monitoring.coreos.com/v1) to be installed" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "fold.fullname" . }}
  labels:
    {{- include "fold.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "fold.selectorLabels" . | nindent 6 }}
  endpoints:
    # The telemetry port when it exists, the main port otherwise. Scraping the
    # main port only works where server.allowedHosts admits the pod IP the
    # operator dials, which in practice means "*" — see metrics.listener.
    - port: {{ if .Values.metrics.listener.enabled }}metrics{{ else }}http{{ end }}
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
