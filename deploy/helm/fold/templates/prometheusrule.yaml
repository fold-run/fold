{{- if .Values.metrics.prometheusRule.enabled }}
{{- if not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- fail "metrics.prometheusRule.enabled requires the prometheus-operator CRDs (monitoring.coreos.com/v1) to be installed" }}
{{- end }}
{{- $labels := .Values.metrics.prometheusRule.additionalLabels }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "fold.fullname" . }}
  labels:
    {{- include "fold.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    # Things that mean fold is failing to serve.
    - name: fold.availability
      rules:
        # The SLO's error budget, burning fast. Denied, rate_limited, and
        # budget_exhausted are excluded deliberately: those are the gateway
        # refusing on purpose, and paging on correct governance teaches
        # everyone to ignore the page.
        - alert: FoldErrorRateHigh
          expr: |
            sum(rate(fold_requests_total{outcome=~"error|upstream_down"}[5m]))
              / clamp_min(sum(rate(fold_requests_total[5m])), 0.001)
              > {{ .Values.metrics.prometheusRule.errorRatioThreshold }}
          for: 10m
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: fold is failing {{ "{{" }} $value | humanizePercentage {{ "}}" }} of requests
            description: >-
              Failures here are fold's own: an upstream unreachable or an internal error.
              Refusals (denied, rate_limited, budget_exhausted) are excluded — check the
              audit stream for those. Start with the circuit-breaker panel.

        - alert: FoldRequestLatencyHigh
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(fold_request_duration_seconds_bucket[5m])))
              > {{ .Values.metrics.prometheusRule.latencyP99Seconds }}
          for: 10m
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: fold p99 request latency is {{ "{{" }} $value | humanizeDuration {{ "}}" }}
            description: >-
              End-to-end latency, which includes the upstream's own time — this threshold is a
              deployment choice, not a fold constant, so tune metrics.prometheusRule.latencyP99Seconds
              to your slowest legitimate tool. Compare against fold_upstream_request_duration_seconds
              before suspecting the gateway.

        # The gateway recovers panics instead of dying from them, but every
        # one is a bug that was one missing recover() from an outage.
        - alert: FoldPanicRecovered
          expr: increase(fold_panics_total[10m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: fold recovered a panic at site {{ "{{" }} $labels.site {{ "}}" }}
            description: >-
              The process survived and the affected request was answered with an internal
              error, but a panic is always a bug. The paired log line ("panic recovered")
              carries the stack trace — file it.

        # The two conditions that page. Everything else in this pack is a
        # warning about something fold is surviving; these two are fold not
        # serving. FoldDown is the scrape target itself, so it fires when
        # every pod is gone or unready — including the readiness-on-/health
        # case where a total upstream outage empties the Service.
        - alert: FoldDown
          expr: up{job="{{ include "fold.fullname" . }}"} == 0
          for: 2m
          labels:
            severity: critical
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: fold instance {{ "{{" }} $labels.instance {{ "}}" }} is not being scraped
            description: >-
              The scrape target is down: the pod is gone, unready, or not answering /metrics.
              With readiness on /health this is also what a total upstream outage looks like
              from outside — check fold_upstream_breaker_state on the surviving instances, and
              the pods' events, before assuming the gateway itself crashed.

        - alert: FoldAllRequestsFailing
          expr: |
            sum(rate(fold_requests_total{outcome="upstream_down"}[5m]))
              / clamp_min(sum(rate(fold_requests_total[5m])), 0.001)
              > 0.9
          for: 5m
          labels:
            severity: critical
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: fold is answering upstream_down for {{ "{{" }} $value | humanizePercentage {{ "}}" }} of requests
            description: >-
              Nearly every request is failing because no upstream is reachable — the gateway
              is up and refusing, which is the honest answer, but the federation is not
              serving. Start with the circuit-breaker panel and the upstreams' own health.

        # Growth without a ceiling is the failure the short benchmark cannot
        # see. Both thresholds are deployment choices: size them from a
        # steady-state scrape of your own federation.
        - alert: FoldGoroutinesHigh
          expr: go_goroutines{job="{{ include "fold.fullname" . }}"} > {{ .Values.metrics.prometheusRule.goroutinesThreshold }}
          for: 15m
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: fold instance {{ "{{" }} $labels.instance {{ "}}" }} has {{ "{{" }} $value {{ "}}" }} goroutines
            description: >-
              Sustained goroutine growth is a leak — sessions, streams, or subscriptions that
              are not being released. Compare fold_downstream_sessions and
              fold_upstream_bridged_sessions against client count before restarting anything.

        - alert: FoldMemoryHigh
          expr: process_resident_memory_bytes{job="{{ include "fold.fullname" . }}"} > {{ .Values.metrics.prometheusRule.memoryBytesThreshold }}
          for: 15m
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: fold instance {{ "{{" }} $labels.instance {{ "}}" }} RSS is {{ "{{" }} $value | humanize1024 {{ "}}" }}B
            description: >-
              Resident memory is approaching the container limit. If it tracks session count it
              is load; if it grows at steady load it is a leak — either way raise the limit
              before the OOM killer decides for you, then find out which.

    # Things that mean an upstream is failing, which fold is surviving.
    - name: fold.upstreams
      rules:
        - alert: FoldUpstreamCircuitOpen
          expr: fold_upstream_breaker_state == 2
          for: 5m
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: circuit open for upstream {{ "{{" }} $labels.upstream {{ "}}" }}
            description: >-
              fold has stopped sending requests to this upstream and is answering -31041 for it.
              The federation still serves everything else; lists degrade with a partialFailure
              marker rather than failing.

        - alert: FoldUpstreamEndpointEjected
          expr: fold_upstream_endpoint_healthy == 0
          for: 15m
          labels:
            severity: info
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: endpoint {{ "{{" }} $labels.endpoint {{ "}}" }} of {{ "{{" }} $labels.upstream {{ "}}" }} is out of rotation
            description: >-
              One replica is ejected; the others carry the traffic. Sustained ejection means the
              replica never recovered, not that traffic is failing.

    # Things that mean governance is not being enforced the way it reads.
    - name: fold.governance
      rules:
        # The one to alert on unconditionally: a budget decided without shared
        # state means a fleet of N instances is enforcing N separate copies of
        # one allowance.
        - alert: FoldBudgetDegraded
          expr: increase(fold_budget_degraded_total[10m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: budget for scope {{ "{{" }} $labels.scope {{ "}}" }} decided without shared state
            description: >-
              Redis was unreachable, so this instance fell back to its own counter. Budgets fail
              open by design — service continues — but the fleet is no longer enforcing one
              allowance. Check Redis before the period rolls.

        # The limiter/breaker peer of FoldBudgetDegraded: decisions are
        # being made per-instance, so N instances enforce N copies of one
        # limit until Redis recovers.
        - alert: FoldStateDegraded
          expr: increase(fold_state_degraded_total[10m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: "{{ "{{" }} $labels.kind {{ "}}" }} decisions degraded to per-instance enforcement"
            description: >-
              Redis was unreachable, so rate limits and circuit breakers fell back to each
              instance's local mirror. Service continues and per-instance enforcement still
              applies, but the fleet is not enforcing one limit. Check Redis.

        # Detection, not accusation: a team shipping a better description
        # trips this exactly like a poisoner does. What it says is that the
        # instructions a model acts on changed after the federation was
        # approved, which is a thing a human should confirm either way.
        - alert: FoldDefinitionDrift
          expr: increase(fold_definition_drift_total[15m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: "{{ "{{" }} $labels.upstream {{ "}}" }} rewrote a {{ "{{" }} $labels.kind {{ "}}" }} definition"
            description: >-
              An upstream changed a definition fold had already served — a description,
              schema, or annotation rewritten after the federation was approved. The audit
              event `upstream/definitionChanged` names the tool and carries both digests.
              Confirm the change with whoever runs that upstream; the new definition is
              already the baseline, so this fires once per change.

        - alert: FoldUpstreamResponseCapped
          expr: increase(fold_upstream_response_capped_total[15m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: "{{ "{{" }} $labels.upstream {{ "}}" }} sent a response past maxResponseBytes"
            description: >-
              An upstream returned more in one response than the gateway will hold, so the
              response was refused and the call failed with -31041. fold does not truncate
              here on purpose: a shortened body would be a response the upstream never sent.
              Either the upstream is returning far more than an MCP payload should be, or
              maxResponseBytes is below what this federation legitimately needs.

        # The hook is the one place fold adds latency deliberately, so its
        # failures and its cost both get a rule. The error rule matters most
        # under onError "allow": those calls proceeded uninspected.
        - alert: FoldHookErrors
          expr: increase(fold_hook_decisions_total{outcome="error"}[10m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: "decision hook failing at the {{ "{{" }} $labels.stage {{ "}}" }} stage"
            description: >-
              The external decision endpoint timed out, refused the connection, or answered
              something fold could not read. With onError "deny" these calls are being
              refused; with onError "allow" they proceeded UNINSPECTED. Audit events carry
              hookOutcome "error" for exactly the calls affected.

        - alert: FoldHookLatencyHigh
          expr: |
            histogram_quantile(0.99, sum by (le, stage) (rate(fold_hook_duration_seconds_bucket[5m])))
              > {{ .Values.metrics.prometheusRule.hookLatencyP99Seconds }}
          for: 10m
          labels:
            severity: info
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: "decision hook p99 is {{ "{{" }} $value | humanizeDuration {{ "}}" }}"
            description: >-
              Latency added to every inspected invocation, on purpose. Not a fold
              regression — it is what inspection costs. Set this threshold from your
              configured timeoutMs.

        - alert: FoldDiscoverySyncFailing
          expr: increase(fold_discovery_syncs_total{outcome=~"rejected|error"}[15m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: discovery sync {{ "{{" }} $labels.outcome {{ "}}" }}
            description: >-
              The last good upstream set is still serving (fail-safe), but the document is not
              being applied. `rejected` means it failed validation or collided with a static
              upstream — an id collision freezes discovery until it is resolved, so it is worth
              treating as urgent even though nothing is down.

        - alert: FoldJWKSFetchFailing
          expr: increase(fold_jwks_fetches_total{outcome=~"error|stale"}[10m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: JWKS fetch {{ "{{" }} $labels.outcome {{ "}}" }} for issuer {{ "{{" }} $labels.issuer {{ "}}" }}
            description: >-
              fold could not refresh this issuer's key set. `stale` means the last good set is
              still verifying tokens and callers are unaffected so far; `error` means nothing is
              cached and every token from this issuer is being refused. Either way the fault is
              at the identity provider — without this alert it looks exactly like a wave of
              clients presenting bad tokens.

        - alert: FoldTenantBudgetExhausted
          expr: increase(fold_tenant_requests_total{outcome="budget_exhausted"}[15m]) > 0
          labels:
            severity: info
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: tenant {{ "{{" }} $labels.tenant {{ "}}" }} has spent its budget
            description: >-
              This customer is being refused with -31044 until the period rolls. Nothing is
              broken; someone should decide whether to widen the allowance, which is a reload
              rather than a restart.

        # The audit trail cannot report its own gaps, so this is where a gap
        # becomes visible. dead_lettered is recoverable — the events are in a
        # file waiting to be replayed — while dropped is not, which is why the
        # remedy differs and both are worth knowing about.
        - alert: FoldAuditEventsLost
          expr: increase(fold_audit_events_total{outcome=~"dropped|dead_lettered"}[10m]) > 0
          labels:
            severity: warning
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: audit sink {{ "{{" }} $labels.sink {{ "}}" }} is losing events ({{ "{{" }} $labels.outcome {{ "}}" }})
            description: >-
              fold could not deliver audit events. `dead_lettered` means they were written to
              deadLetterPath and can be replayed; `dropped` means they are gone — either the
              buffer filled while a receiver was down, or delivery was abandoned with no
              deadLetterPath set. Either way the compliance record has a hole in it for this
              window.

        # Rebinding protection and auth failures are quiet in a healthy
        # deployment. A spike is a misconfigured client or someone probing.
        - alert: FoldIngressRejectionSpike
          expr: |
            sum by (reason) (rate(fold_http_rejections_total{reason=~"forbidden_host|forbidden_origin|unauthenticated"}[5m]))
              > {{ .Values.metrics.prometheusRule.rejectionRateThreshold }}
          for: 10m
          labels:
            severity: info
            {{- with $labels }}{{ toYaml . | nindent 12 }}{{- end }}
          annotations:
            summary: fold is rejecting {{ "{{" }} $value | printf "%.2f" {{ "}}" }}/s at the edge ({{ "{{" }} $labels.reason {{ "}}" }})
            description: >-
              These are refused before the MCP layer. A new client with the wrong Host header
              looks identical to a probe from outside — check which, then either fix
              server.allowedHosts or leave it refusing.
{{- end }}
