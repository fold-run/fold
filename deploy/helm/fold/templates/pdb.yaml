{{- /* A budget only helps when there is more than one pod to protect: with
a single fixed replica, minAvailable: 1 would block every voluntary drain
rather than bound disruption. Autoscaled deployments qualify via their
minReplicas floor. */}}
{{- $protects := or .Values.autoscaling.enabled (ge (int .Values.replicaCount) 2) }}
{{- if and .Values.podDisruptionBudget.enabled $protects }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fold.fullname" . }}
  labels:
    {{- include "fold.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "fold.selectorLabels" . | nindent 6 }}
{{- end }}
