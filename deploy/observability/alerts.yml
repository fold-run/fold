# fold alert rules for a plain Prometheus (docker compose, systemd, a VM — any
# deployment without the prometheus-operator). The chart ships the same rules
# as a PrometheusRule with the thresholds exposed as values; here they are
# literals, so edit them in place.
#
# The two files are kept in step by test (gateway/observability_pack_test.go):
# an alert added to one and not the other fails the build. What the alerts
# assume, and why none of them page, is in docs/operations.md.
groups:
  # Things that mean fold is failing to serve.
  - name: fold.availability
    rules:
      # Refusals are excluded from the numerator on purpose: denied,
      # rate_limited, and budget_exhausted are the gateway working as
      # configured, and paging on correct governance teaches everyone to
      # ignore the page.
      - alert: FoldErrorRateHigh
        expr: |
          sum(rate(fold_requests_total{outcome=~"error|upstream_down"}[5m]))
            / clamp_min(sum(rate(fold_requests_total[5m])), 0.001)
            > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: fold is failing {{ $value | humanizePercentage }} of requests
          description: >-
            Failures here are fold's own: an upstream unreachable or an internal error.
            Refusals (denied, rate_limited, budget_exhausted) are excluded — check the
            audit stream for those. Start with the circuit-breaker panel.

      # End-to-end latency includes the upstream's own time, so this bound is a
      # deployment choice rather than a fold constant. Set it from your slowest
      # legitimate tool.
      - alert: FoldRequestLatencyHigh
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(fold_request_duration_seconds_bucket[5m])))
            > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: fold p99 request latency is {{ $value | humanizeDuration }}
          description: >-
            Compare against fold_upstream_request_duration_seconds before suspecting the
            gateway: this measurement contains whatever the upstream took.

  # Things that mean an upstream is failing, which fold is surviving.
  - name: fold.upstreams
    rules:
      - alert: FoldUpstreamCircuitOpen
        expr: fold_upstream_breaker_state == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: circuit open for upstream {{ $labels.upstream }}
          description: >-
            fold has stopped sending requests to this upstream and is answering -32041 for
            it. The federation still serves everything else; lists degrade with a
            partialFailure marker rather than failing.

      - alert: FoldUpstreamEndpointEjected
        expr: fold_upstream_endpoint_healthy == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: endpoint {{ $labels.endpoint }} of {{ $labels.upstream }} is out of rotation
          description: >-
            One replica is ejected; the others carry the traffic. Sustained ejection means
            the replica never recovered, not that traffic is failing.

  # Things that mean governance is not being enforced the way it reads.
  - name: fold.governance
    rules:
      - alert: FoldBudgetDegraded
        expr: increase(fold_budget_degraded_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: budget for scope {{ $labels.scope }} decided without shared state
          description: >-
            Redis was unreachable, so this instance fell back to its own counter. Budgets
            fail open by design — service continues — but the fleet is no longer enforcing
            one allowance. Check Redis before the period rolls.

      - alert: FoldDiscoverySyncFailing
        expr: increase(fold_discovery_syncs_total{outcome=~"rejected|error"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: discovery sync {{ $labels.outcome }}
          description: >-
            The last good upstream set is still serving (fail-safe), but the document is not
            being applied. `rejected` means it failed validation or collided with a static
            upstream — an id collision freezes discovery until it is resolved.

      - alert: FoldTenantBudgetExhausted
        expr: increase(fold_tenant_requests_total{outcome="budget_exhausted"}[15m]) > 0
        labels:
          severity: info
        annotations:
          summary: tenant {{ $labels.tenant }} has spent its budget
          description: >-
            This customer is being refused with -32044 until the period rolls. Nothing is
            broken; someone should decide whether to widen the allowance, which is a reload
            rather than a restart.

      # The audit trail cannot report its own gaps, so this is where a gap
      # becomes visible. dead_lettered is recoverable — the events are in a
      # file waiting to be replayed — while dropped is not.
      - alert: FoldAuditEventsLost
        expr: increase(fold_audit_events_total{outcome=~"dropped|dead_lettered"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: audit sink {{ $labels.sink }} is losing events ({{ $labels.outcome }})
          description: >-
            fold could not deliver audit events. `dead_lettered` means they were written to
            deadLetterPath and can be replayed; `dropped` means they are gone — either the
            buffer filled while a receiver was down, or delivery was abandoned with no
            deadLetterPath set. Either way the compliance record has a hole in it for this
            window.

      - alert: FoldIngressRejectionSpike
        expr: |
          sum by (reason) (rate(fold_http_rejections_total{reason=~"forbidden_host|forbidden_origin|unauthenticated"}[5m]))
            > 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: fold is rejecting {{ $value | printf "%.2f" }}/s at the edge ({{ $labels.reason }})
          description: >-
            These are refused before the MCP layer. A new client with the wrong Host header
            looks identical to a probe from outside — check which, then either fix
            server.allowedHosts or leave it refusing.
