# Prometheus for a single-host fold deployment (docker compose --profile
# observability up). Kubernetes users do not need this file: the chart's
# ServiceMonitor and PrometheusRule cover the same ground through the
# prometheus-operator.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # fold exposes /metrics unauthenticated on the same port as /mcp, so this is
  # the whole configuration. On a public deployment, keep the metrics port off
  # the internet rather than adding auth here — /metrics is not sensitive, but
  # it is a free description of your federation's shape.
  #
  # Prometheus sends Host: fold:8080, derived from the target below, and fold's
  # DNS-rebinding protection applies to /metrics like every other path. The
  # gateway's config must admit that name:
  #   "server": { "allowedHosts": ["localhost", "fold"] }
  # Without it the scrape is answered 403 and this target reads as down.
  - job_name: fold
    metrics_path: /metrics
    static_configs:
      - targets: ["fold:8080"]
