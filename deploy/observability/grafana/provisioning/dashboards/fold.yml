# Loads whatever JSON is mounted at /var/lib/grafana/dashboards. compose mounts
# the same file the Helm chart ships, so the two deployments cannot drift into
# showing different dashboards.
apiVersion: 1
providers:
  - name: fold
    type: file
    disableDeletion: true
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
