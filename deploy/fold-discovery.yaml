# fold-discovery: the Kubernetes discovery-document producer.
# Lists Services labeled fold.run/upstream=true and serves the discovery
# document a fold gateway polls via its `discovery.url`.
#
# Apply in two steps — the token is the one object this file cannot carry:
#
#   kubectl apply -f deploy/fold-discovery.yaml            # namespace, RBAC, Deployment, Service
#   kubectl -n fold create secret generic fold-discovery-token \
#     --from-literal=token="$(openssl rand -hex 32)"        # the poll credential
#
# The gateway presents the same value as FOLD_DISCOVERY_TOKEN (its
# `discovery.bearerSecretRef`), so put it in the gateway's Secret too. Until
# the Secret exists the pod sits in CreateContainerConfigError, which is the
# manifest refusing to run unauthenticated rather than a mistake.
#
# RBAC is a namespaced Role by default — the producer lists Services in one
# namespace, its own — because a component that can read every Service in
# the cluster should have to be granted that on purpose. To watch another
# namespace, change the Role's and RoleBinding's namespace and --namespace
# together; to watch the whole cluster, replace both with the ClusterRole and
# ClusterRoleBinding commented out below and drop --namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: fold
  labels:
    # The pod below satisfies the restricted profile; say so where the
    # admission controller reads it.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fold-discovery
  namespace: fold
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fold-discovery
  namespace: fold
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fold-discovery
  namespace: fold
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fold-discovery
subjects:
  - kind: ServiceAccount
    name: fold-discovery
    namespace: fold
# --- cluster-wide variant: replace the Role and RoleBinding above with these
# --- and remove --namespace from the container args.
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRole
# metadata:
#   name: fold-discovery
# rules:
#   - apiGroups: [""]
#     resources: ["services"]
#     verbs: ["get", "list"]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: fold-discovery
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: ClusterRole
#   name: fold-discovery
# subjects:
#   - kind: ServiceAccount
#     name: fold-discovery
#     namespace: fold
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fold-discovery
  namespace: fold
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fold-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fold-discovery
    spec:
      serviceAccountName: fold-discovery
      # The producer talks to the API server with this token; it is the one
      # fold component that needs it mounted.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fold-discovery
          image: ghcr.io/fold-run/fold-discovery:v1.15.0 # equals the chart appVersion, enforced by gateway/release_pins_test.go and bumped by the release flow
          args:
            - --log-format
            - json
            # Matches the Role above; remove for the ClusterRole variant.
            - --namespace
            - fold
            # Registration bounds — see docs/discovery-controller.md.
            # Namespace prefixing is on by default (anti-squatting); add
            # --allow-unprefixed-ids only in single-tenant clusters.
            - --bearer-env
            - FOLD_DISCOVERY_TOKEN
            # Uncomment to let Services carry credentials, always paired
            # with a destination allowlist:
            # - --allow-auth-strategies
            # - static
            # - --allow-secret-refs
            # - ML_SEARCH_API_KEY
            # - --allow-credential-hosts
            # - "*.svc.cluster.local"
            # List the gateway's static upstream ids so a Service cannot
            # publish a collision that freezes discovery:
            # - --reserved-ids
            # - github-tools,ml-search
          env:
            - name: FOLD_DISCOVERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fold-discovery-token
                  key: token
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fold-discovery
  namespace: fold
spec:
  selector:
    app.kubernetes.io/name: fold-discovery
  ports:
    - name: http
      port: 8090
      targetPort: http
# Pointing the gateway at it. fold requires https for discovery.url except on
# loopback, so the shape that works with nothing else installed is the
# producer as a sidecar in the gateway pod:
#
#   "discovery": { "url": "http://127.0.0.1:8090/upstreams.json",
#                  "bearerSecretRef": "FOLD_DISCOVERY_TOKEN",
#                  "allowedUpstreamHosts": ["*.svc.cluster.local"],
#                  "allowedCredentialHosts": ["*.svc.cluster.local"] }
#
# To use this standalone Service instead, put TLS in front of it — a service
# mesh or an in-cluster certificate — and point at
#   https://fold-discovery.fold.svc.cluster.local:8090/upstreams.json
