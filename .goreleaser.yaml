# Release pipeline: binaries, archives, checksums, SBOMs, GitHub release
# notes. Run by .github/workflows/release.yml on tag push; the container
# image is built separately in that workflow. Validate with `goreleaser check`.
version: 2

project_name: fold

builds:
  - id: fold
    main: ./cmd/fold
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/fold-run/fold/gateway.ldflagsVersion={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The Kubernetes discovery-document producer. Linux-only: it runs in a
  # cluster, listing Services with the pod's service account.
  - id: fold-discovery
    main: ./cmd/fold-discovery
    binary: fold-discovery
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The stdio shim. Unlike fold-discovery this is not linux-only: it runs
  # wherever the stdio servers run, which includes developer machines pointing
  # a local gateway at a local server.
  - id: fold-stdio
    main: ./cmd/fold-stdio
    binary: fold-stdio
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # Keep the pre-goreleaser naming: fold_v1.2.3_linux_amd64.tar.gz
  - id: fold
    ids: [fold]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - fold.config.example.json
      - src: config/fold.config.schema.json
        dst: fold.config.schema.json

  - id: fold-discovery
    ids: [fold-discovery]
    name_template: "fold-discovery_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: deploy/fold-discovery.yaml
        dst: fold-discovery.yaml

  - id: fold-stdio
    ids: [fold-stdio]
    name_template: "fold-stdio_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: docs/stdio.md
        dst: stdio.md

checksum:
  name_template: checksums.txt

# Keyless cosign signature on the checksum file, for operators verifying
# outside the `gh attestation` toolchain (the GitHub attestation covers the
# same subjects). The release workflow installs cosign and provides the OIDC
# identity (id-token: write).
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

sboms:
  - artifacts: archive

changelog:
  use: github
  filters:
    exclude:
      - "^build\\(deps\\)"
