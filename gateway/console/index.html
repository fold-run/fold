<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>fold console</title>
  <!--
    The square slot gets the wordmark's own d on Backplane, per fold's identity
    system: no invented mark. Inline as a data: URI rather than a file, because
    `img-src 'self' data:` already admits it and a new file would mean a change
    to fold's vendoring manifest for 300 bytes. Without it an operator's tab
    shows the browser's default globe next to three other gateway tabs.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1807 1807'%3E%3Crect width='1807' height='1807' fill='%23121212'/%3E%3Cpath fill='%23FFFFFF' d='M1045 1637V170h442v1467ZM559 1637 320 1398V814l239-239h416v265H762v549h213v143l-105 105Z'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="./app.js"></script>
  <link rel="stylesheet" crossorigin href="./style.css">
</head>
<body>
  <!-- The shell renders here. Deliberately empty: the page is served from an
       embedded filesystem with no server-side rendering, and anything static
       enough to ship in this file would be replaced on first paint anyway. -->
  <div id="app"></div>
  <noscript>
    The fold console is a client-side application and needs JavaScript. The
    same data is available without it from the gateway's read APIs —
    <code>GET /api/federation</code> and <code>GET /api/auth-hint</code>.
  </noscript>
</body>
</html>
