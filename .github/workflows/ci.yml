name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual dispatch: webhook-triggered runs can be throttled during GitHub
  # incidents (2026-08-06 outage dropped a release push's run entirely);
  # API-created dispatches give CI a path that does not depend on webhook
  # delivery.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: make fmt-check

      - name: go mod tidy
        run: make tidy-check

      - name: vet
        run: make vet

      - name: build
        run: make build

      - name: test (race + coverage)
        run: make cover

      - name: coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: make vuln

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: added-latency gate
        run: FOLD_BENCH=1 go test ./bench -run TestAddedLatencyGate -v

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint + template
        run: make helm-check

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: conformance suite through the gateway
        run: ./scripts/conformance.sh

  # gateway/console is vendored from fold-run/fold-console, so this proves the
  # checked-in bytes are exactly the pinned commit. Without it a hand edit here
  # would silently fork the console from its source of truth and nothing would
  # notice — which would make "the console is maintained elsewhere" a claim
  # rather than a fact.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Assert the source too, not just the bytes. `console-check` proves the
      # vendored tree matches whatever repo and commit THIS commit declares, so
      # a PR that repoints CONSOLE_REPO at an attacker's fork and vendors
      # matching bytes would otherwise pass green.
      - name: console pin points at the canonical repo
        run: grep -q 'CONSOLE_REPO:-https://github.com/fold-run/fold-console.git' scripts/sync-console.sh

      - name: vendored console matches its pin
        run: make console-check

  # The release images are built here without pushing, because the release
  # workflow's image job only runs on a tag — so a Dockerfile that cannot
  # build sat on main through two green merges and failed at the one moment
  # it is expensive to discover, after the tag was pushed and the binaries
  # and chart had already published. The specific skew was a builder base
  # pinned below the version go.mod requires, which the image cannot fix at
  # build time because it sets GOTOOLCHAIN=local. Single-platform on purpose:
  # this gate is "does it build", and cross-building both arches per PR buys
  # nothing the release job does not already prove.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/fold.Dockerfile
          push: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

      - name: build stdio image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/stdio.Dockerfile
          push: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

      - name: build discovery image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/discovery.Dockerfile
          push: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

      - name: build registry image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/registry.Dockerfile
          push: false
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
