name: release

on:
  push:
    tags: ["v*"]
  # Chart-only publish for an existing tag: the chart versions independently
  # of the gateway, so a chart fix (or a backfill for a release that shipped
  # before this job existed) must not require a new gateway release to reach
  # the registry. Binaries and images stay tag-triggered — they are immutable
  # per release and have no reason to be republished.
  workflow_dispatch:
    inputs:
      chart_tag:
        description: "Release tag whose chart to publish (e.g. v1.8.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # provenance attestation (sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser derives the changelog from history

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

  # The chart publishes to the same registry as the images, versioned on its
  # own `version` field rather than the gateway's: a chart fix that ships no
  # new gateway is a chart release, and pinning the two together would force
  # one to lie. `appVersion` is what ties a chart to a gateway build, and the
  # release flow bumps it (see .claude/skills/fold-release).
  chart:
    runs-on: ubuntu-latest
    env:
      # The tag being published: the pushed tag, or the one named on a
      # chart-only dispatch.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.chart_tag || github.ref_name }}
    steps:
      # Check out the tag rather than the default branch, so a dispatch
      # publishes the chart as that release shipped it, not as main has it now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.chart_tag || github.ref_name }}

      - uses: azure/setup-helm@v5

      # Publishing a chart that renders wrong is worse than not publishing:
      # a `helm install` from an OCI registry has no repo checkout to inspect
      # first. Lint and render every ci/ value set before anything is pushed.
      - name: lint and render
        run: make helm-check

      # The chart deploys the gateway image by default (values.yaml ships
      # `image.tag: ""`, which falls back to appVersion), so a chart whose
      # appVersion does not name this tag would publish an install that
      # silently runs a different version than the release it shipped with.
      - name: appVersion must match the tag
        run: |
          app=$(helm show chart deploy/helm/fold | awk '/^appVersion:/ {print $2}' | tr -d '"')
          if [[ "$app" != "$TAG" ]]; then
            echo "chart appVersion is $app but the release is $TAG" >&2
            echo "bump deploy/helm/fold/Chart.yaml in the release commit" >&2
            exit 1
          fi
          echo "appVersion $app matches $TAG"

      - name: log in to ghcr
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      - name: package and push
        run: |
          helm package deploy/helm/fold --destination dist
          # The chart's own version is the OCI tag; `helm push` derives the
          # repository name from the chart, so the target is the namespace.
          helm push dist/fold-*.tgz oci://ghcr.io/fold-run/charts

  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/fold.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/fold-run/fold:${{ github.ref_name }}
            ghcr.io/fold-run/fold:latest

      - name: build and push discovery image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/discovery.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/fold-run/fold-discovery:${{ github.ref_name }}
            ghcr.io/fold-run/fold-discovery:latest

      # The shim's image is not distroless: its job is to execute a server, and
      # most stdio servers arrive through a language runtime. The published
      # image carries Node, since npx-delivered servers are the common case;
      # operators serving Python servers rebuild with --build-arg RUNTIME_BASE.
      - name: build and push stdio shim image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/stdio.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/fold-run/fold-stdio:${{ github.ref_name }}
            ghcr.io/fold-run/fold-stdio:latest
