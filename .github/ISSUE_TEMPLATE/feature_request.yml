name: Feature request
description: Propose a capability or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Check README ["Not implemented"](https://github.com/fold-run/fold/blob/main/README.md#not-implemented)
        first — some gaps are deliberate and documented, and an issue about
        one of those is a request to reprioritize it, which is fine; just
        say so.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What are you trying to do that fold can't (or makes awkward)? A
        concrete scenario — clients, upstreams, org constraints — beats a
        general capability description.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: >
        What should fold do? If it touches config, sketch the JSON. If it
        changes wire behavior, note how it stays invisible to conformant
        clients and upstreams.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using today, or other designs you rejected.
